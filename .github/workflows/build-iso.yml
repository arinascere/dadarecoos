name: Build ISO

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  check:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - uses: actions/checkout@v4
      - name: Scripts e nomes de pacote
        run: |
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends python3-yaml curl ca-certificates >/dev/null
          for f in auto/config config/hooks/normal/*.chroot config/includes.chroot/usr/lib/dadarecoos/*.sh; do bash -n "$f"; done
          bash config/includes.chroot/usr/lib/dadarecoos/prepare-apt.sh
          python3 tools/check-packages.py

  build:
    needs: check
    runs-on: ubuntu-latest
    container:
      image: debian:trixie
      options: --privileged
    steps:
      - uses: actions/checkout@v4
      - name: Dependências
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends live-build ca-certificates
      - name: Build
        run: |
          # ponytail: sem cache de mirror; cada build baixa tudo (~15-25 min). Adicionar apt-cacher se incomodar.
          lb config
          lb build
      - name: Nomear ISO
        run: |
          iso=$(ls *.iso | head -n1)
          mv "$iso" "dadarecoos-${GITHUB_REF_NAME}-amd64.iso"
          sha256sum dadarecoos-*.iso > SHA256SUMS
          ls -la dadarecoos-*.iso
      - uses: actions/upload-artifact@v4
        with:
          name: dadarecoos-iso
          path: |
            dadarecoos-*.iso
            SHA256SUMS

  boot-test:
    # Liga a ISO numa máquina virtual e guarda capturas de tela: prova que o
    # instalador sobe. Não substitui o teste no notebook de verdade.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dadarecoos-iso
      - name: QEMU
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qemu-system-x86 qemu-utils ovmf >/dev/null
          sudo chmod 666 /dev/kvm
          python3 tools/boot-test.py dadarecoos-*.iso shots/bios
          python3 tools/boot-test.py dadarecoos-*.iso shots/uefi uefi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boot-screenshots
          path: shots/

  install-test:
    needs: build
    uses: ./.github/workflows/install-test.yml
    with:
      run_id: ${{ github.run_id }}

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, boot-test, install-test]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dadarecoos-iso
      - uses: softprops/action-gh-release@v2
        with:
          prerelease: true
          body: "Versão de teste. Ainda não foi instalada em hardware real. Veja o README para o que já é verificado pelo CI."
          files: |
            dadarecoos-*.iso
            SHA256SUMS
