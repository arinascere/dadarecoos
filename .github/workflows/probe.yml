name: Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    container: debian:trixie
    steps:
      - run: |
          sed -i 's/^Components: main$/Components: main contrib non-free non-free-firmware/' /etc/apt/sources.list.d/debian.sources
          apt-get update -qq
          apt-get install -y -qq wget ca-certificates git binutils >/dev/null 2>&1
          wget -q https://pkg.noctalia.dev/deb/nickh-archive-keyring.deb && dpkg -i nickh-archive-keyring.deb >/dev/null
          wget -q -O /etc/apt/sources.list.d/noctalia-trixie.sources https://pkg.noctalia.dev/deb/noctalia-trixie.sources
          apt-get update -qq
          cd /tmp && apt-get download -qq calamares calamares-settings-debian noctalia noctalia-greeter noctalia-data live-build
          echo "=== settings-debian modules"
          mkdir s && dpkg -x calamares-settings-debian*.deb s
          find s/usr/lib s/usr/bin -type f | while read f; do echo "## $f"; cat "$f"; echo; done
          echo "=== calamares strings"
          mkdir c && dpkg -x calamares_*.deb c
          strings c/usr/lib/x86_64-linux-gnu/calamares/modules/packagechooser/*.so | grep -i -E 'netinstall|legacy|^packages$|optionalmultiple|default' | sort -u | head -20
          strings c/usr/lib/x86_64-linux-gnu/libcalamares.so* | grep -E 'gs\[|ROOT' | sort -u | head
          grep -n -i -E 'apt|install' c/usr/lib/x86_64-linux-gnu/calamares/modules/packages/main.py | sed -n 1,60p
          apt-cache depends calamares-settings-debian calamares | grep -E 'Depends|Recommends'
          echo "=== noctalia-greeter"
          dpkg -I noctalia-greeter*.deb; dpkg -c noctalia-greeter*.deb | awk '{print $6}'
          mkdir g && dpkg -e noctalia-greeter*.deb g; for f in g/*; do echo "## $f"; cat $f; done
          mkdir gx && dpkg -x noctalia-greeter*.deb gx; find gx/etc gx/usr/share/doc gx/usr/lib/systemd -type f 2>/dev/null | while read f; do echo "## $f"; head -c 3000 "$f"; done
          echo "=== noctalia files"
          dpkg -c noctalia_*.deb | awk '{print $6}' | grep -v '/$'
          dpkg -c noctalia-data*.deb | awk '{print $6}' | grep -v '/$' | grep -v -E '\.(png|svg|jpg|webp|ttf|wav|ogg)$' | head -80
          mkdir n && dpkg -x noctalia_*.deb n && dpkg -x noctalia-data*.deb n
          find n -name '*.service' -o -name '*.desktop' -o -name '*example*' -o -name '*.kdl' -o -name 'README*' | while read f; do echo "## $f"; head -c 4000 "$f"; done
          n/usr/bin/noctalia --help 2>&1 | head -60 || true
          echo "=== live-build efi"
          mkdir l && dpkg -x live-build*.deb l; grep -n -E 'ia32|i386-efi' l/usr/lib/live/build/binary_grub-efi | head
          echo "=== tags"
          git ls-remote --tags --refs https://github.com/YaLTeR/niri | tail -4
          git ls-remote --tags --refs https://github.com/Supreeeme/xwayland-satellite | tail -3
          git clone -q --depth 1 https://github.com/YaLTeR/niri nr && cd nr && grep -n -A30 'metadata.deb' Cargo.toml; grep -n rust-version Cargo.toml; ls resources; grep -n -i -B2 -A12 'switch-events' resources/default-config.kdl | head -40; grep -rn -i -E 'input.method|text.input|virtual.keyboard' src/niri.rs | head -8
