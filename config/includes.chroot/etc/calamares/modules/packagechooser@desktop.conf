---
mode: required
method: packages
default: plasma
labels:
  step: "Ambiente"
items:
  - id: plasma
    name: "KDE Plasma"
    description: "Recomendado para tela de toque. Visual com barra no topo e dock embaixo. O teclado virtual abre ao tocar num campo de texto."
    packages:
      - plasma-desktop
      - plasma-workspace
      - kwin-wayland
      - sddm
      - sddm-theme-breeze
      - plasma-nm
      - plasma-pa
      - powerdevil
      - bluedevil
      - kscreen
      - systemsettings
      - breeze
      - breeze-gtk-theme
      - kde-config-gtk-style
      - xdg-desktop-portal-kde
      - plasma-systemmonitor
      - dolphin
      - konsole
      - kwrite
      - ark
      - gwenview
      - okular
      - kde-spectacle
      - power-profiles-daemon
  - id: niri
    name: "niri + Noctalia"
    description: "Janelas lado a lado numa faixa rolável. Leve e bonito, melhor com teclado. No toque é limitado: o niri ainda não tem gestos de toque."
    packages:
      - niri
      - xwayland-satellite
      - xwayland
      - noctalia
      - greetd
      - gtkgreet
      - cage
      - alacritty
      - fuzzel
      - nautilus
      - xdg-desktop-portal-gnome
      - xdg-desktop-portal-gtk
      - gnome-keyring
      - brightnessctl
      - playerctl
      - upower
      - wl-clipboard
      - power-profiles-daemon
      - adwaita-icon-theme
