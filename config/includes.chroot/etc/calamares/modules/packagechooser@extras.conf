---
# A linha "default:" é reescrita a cada boot por detect-hw.sh (touch detectado ou não).
mode: optionalmultiple
method: packages
default: ""
labels:
  step: "Extras"
items:
  # O pacote "evtest" marca a escolha para o post-install.sh. Não remover.
  - id: touch
    name: "Tela sensível ao toque"
    description: "Teclado virtual que abre ao tocar num campo de texto, rotação automática e interface maior. Já vem marcado quando o aparelho tem tela de toque."
    packages: [ evtest, iio-sensor-proxy ]
  - id: games
    name: "Jogos (Steam)"
    description: "Instala a Steam e os drivers de vídeo de 32 bits. Ao marcar, você aceita o contrato de licença da Steam."
    packages: [ steam-installer, mesa-vulkan-drivers, "libgl1-mesa-dri:i386", "mesa-vulkan-drivers:i386" ]
  - id: homelab
    name: "Homelab / NAS"
    description: "Jellyfin (suas séries na TV), compartilhamento de arquivos (Samba) e tampa fechada sem suspender. Pasta de mídia: /srv/midia."
    packages: [ samba, avahi-daemon, smartmontools ]
