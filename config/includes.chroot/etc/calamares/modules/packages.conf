---
backend: apt
update_db: false          # prepare-apt.sh já fez o apt-get update
update_system: false
skip_if_no_internet: false

# Comum a todas as escolhas. Ambiente e extras entram pelo packagechooser.
operations:
  - install:
      - firefox-esr
      - firefox-esr-l10n-pt-br
      - libreoffice-writer
      - libreoffice-calc
      - libreoffice-impress
      - libreoffice-gtk3
      - libreoffice-l10n-pt-br
      - hunspell-pt-br
      - mpv
      - pipewire-audio
      - bluez
      - fonts-noto-core
      - fonts-noto-color-emoji
      - xdg-user-dirs
      - xdg-utils
      - zram-tools
      - vainfo
      - unattended-upgrades
