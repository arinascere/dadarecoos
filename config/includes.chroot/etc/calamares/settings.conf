---
# DadarecoOS. Base: calamares-settings-debian (módulos bootloader-config,
# dpkg-unsafe-io, initramfs etc. vêm desse pacote e são os que o Debian testa).
modules-search: [ local, /usr/lib/calamares/modules ]

instances:
- id: desktop
  module: packagechooser
  config: packagechooser@desktop.conf
- id: extras
  module: packagechooser
  config: packagechooser@extras.conf
- id: netprep
  module: shellprocess
  config: shellprocess@netprep.conf
- id: pre
  module: shellprocess
  config: shellprocess@pre.conf
- id: post
  module: shellprocess
  config: shellprocess@post.conf

sequence:
- show:
  - welcome                  # exige internet (welcome.conf)
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@desktop
  - packagechooser@extras
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - luksbootkeyfile
  - dpkg-unsafe-io
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - networkcfg
  - hwclock
  - shellprocess@netprep     # DNS dentro do destino
  - shellprocess@pre         # repositórios (prepare-apt.sh)
  - packages                 # ambiente + extras escolhidos, pela internet
  - shellprocess@post        # regras de hardware e ajustes (post-install.sh)
  - users                    # depois do post: o /etc/skel já está pronto
  - bootloader-config
  - grubcfg
  - bootloader
  - initramfscfg
  - initramfs
  - dpkg-unsafe-io-undo
  - umount
- show:
  - finished

branding: dadarecoos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
