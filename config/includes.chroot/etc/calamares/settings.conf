---
modules-search: [ local ]

instances:
- id: desktop
  module: packagechooser
  config: packagechooser@desktop.conf
- id: extras
  module: packagechooser
  config: packagechooser@extras.conf
- id: pre
  module: shellprocess
  config: shellprocess@pre.conf
- id: post
  module: shellprocess
  config: shellprocess@post.conf

sequence:
- show:
  - welcome          # exige internet (ver welcome.conf)
  - locale
  - keyboard
  - partition
  - users
  - packagechooser@desktop
  - packagechooser@extras
  - summary
- exec:
  - partition
  - mount
  - unpackfs
  - machineid
  - fstab
  - locale
  - keyboard
  - localecfg
  - users
  - networkcfg
  - hwclock
  - shellprocess@pre
  - packages
  - shellprocess@post
  - bootloader
  - umount
- show:
  - finished

branding: dadarecoos
prompt-install: false
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: true
quit-at-end: false
